        </a>
      </div>

      <!-- Desktop Navigation -->
      <ul class="hidden lg:flex items-center gap-5">

          <a [href]="item.link" 
             class="nav-link"
             (click)="closeMenu()">

      </ul>

      <div class="hidden lg:flex items-center gap-4">
        
        <a href="#projects" class="cta-button">
          <i class="fas fa-briefcase mr-2"></i>
          Ver Proyectos
        </a>

        <!-- NUEVO BOTÓN DE TEMA SIMPLIFICADO -->

        <!-- CUSTOM THEME SELECTOR -->
        <div class="relative">
          <!-- Botón que activa el menú -->
          <button (click)="toggleThemeMenu()" 
                  style="color: var(--text-primary); border-color: var(--text-primary);"
                  class="flex items-center justify-between w-15 h-7 px-3 gap-3 rounded-full border-2 hover:opacity-70 transition-opacity duration-300"
                  title="Seleccionar tema visual">
            
            <!-- Icono dinámico según el tema actual -->
            @if (themeService.currentTheme() === 'light') {
              <i class="fas fa-sun text-sm"></i>
            } @else if (themeService.currentTheme() === 'dark') {
              <i class="fas fa-moon text-sm"></i>
            } @else {
              <i class="fas fa-palette text-sm"></i>
            }
            
            <!-- Flechita indicadora de dropdown -->
            <i class="fas fa-chevron-down text-xs transition-transform duration-300" 
               [class.rotate-180]="isThemeMenuOpen"></i>
          </button>

          <!-- Menú Desplegable -->
          @if (isThemeMenuOpen) {
            <div class="absolute right-0 mt-3 w-48 rounded-xl shadow-2xl overflow-hidden z-50 border backdrop-blur-md"
                 style="background-color: color-mix(in srgb, var(--bg-secondary) 95%, transparent); border-color: var(--border-color);">
              <ul class="py-2 focus:outline-none">
                
                @for (theme of availableThemes; track theme.id) {
                  <li>
                    <button (click)="selectTheme(theme.id)"
                            class="w-full text-left px-4 py-2.5 flex items-center gap-3 transition-colors duration-200 hover:bg-black/5 dark:hover:bg-white/10"
                            style="color: var(--text-primary);">
                      
                      <!-- Icono de la opción -->
                      <i [class]="theme.icon + ' w-5 text-center'"></i>
                      
                      <!-- Nombre de la opción -->
                      <span class="text-sm font-medium">{{ theme.name }}</span>
                      
                      <!-- Checkmark si es la opción activa -->
                      @if (themeService.currentTheme() === theme.id) {
                        <i class="fas fa-check ml-auto text-barca-gold text-xs"></i>
                      }
                    </button>
                  </li>
                }

              </ul>
            </div>
          }
        </div>

        <!-- <button class="lang-button dark:border-white dark:text-white dark:hover:bg-white dark:hover:text-barca-dark">ES</button> -->
      </div>

      <!-- Mobile Menu Button -->
      <button (click)="toggleMenu()" 
              class="lg:hidden text-barca-dark focus:outline-none"
              aria-label="Toggle menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="!isMenuOpen" 
                stroke-linecap="round" 
                stroke-linejoin="round" 
                stroke-width="2" 
                d="M4 6h16M4 12h16M4 18h16"/>
          <path *ngIf="isMenuOpen" 
                stroke-linecap="round" 
                stroke-linejoin="round" 
                stroke-width="2" 
                d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMenuOpen" 
         class="lg:hidden pb-4 border-t border-gray-200 mt-2"
         [@slideDown]>
      <ul class="space-y-2 mt-4">
        <li *ngFor="let item of menuItems">
          <a [href]="item.link" 
             (click)="closeMenu()"
             class="mobile-nav-link">
            {{ item.name }}
          </a>
        </li>
        <li class="pt-4 border-t border-gray-200">
          <!-- <a href="#contact" class="mobile-nav-link">

        </li>
        <li>

            </button>
          </a>
        </li>
      </ul>
    </div>
